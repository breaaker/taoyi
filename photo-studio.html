<html lang="zh-CN"><head><script src="./engine/app-entry.js?v=20261005file1"></script><style>html.scene-loading body{visibility:hidden}html.scene-loading .scene-handoff-backdrop,html.scene-loading .vessel-handoff{visibility:visible}</style><script>try{if(sessionStorage.getItem("clay-and-flame-scene-handoff-v1"))document.documentElement.classList.add("scene-loading") }catch(_){}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122019"><title>成品取景 · 泥与火</title><link rel="stylesheet" href="./photo-studio.css?v=20261003stand2"><link rel="stylesheet" href="./order-peek.css?v=20261003d"><link rel="stylesheet" href="./reference-viewer.css"><link rel="stylesheet" href="./mobile-shell.css?v=20261004frame3"><link rel="stylesheet" href="./game-frame.css?v=20261004spa3"><link rel="stylesheet" href="./glass.css?v=20261005clear1"><link rel="stylesheet" href="./locale.css?v=20261005en1"></head>
<body><main class="studio">
<header class="topbar"><a href="./index.html" aria-label="返回工坊"><svg class="button-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M26 16H6M13 9l-7 7 7 7"/></svg></a><div><strong>泥与火</strong><small>成品取景台 / E4</small></div><span id="status">准备取景</span></header>
<div class="layout"><section class="camera-panel" aria-label="成品取景">
  <div class="eyebrow">WORK / 01</div><h1>留住窑火之后<br>的这一刻</h1><p class="intro">拖动陶器转向，调好光，再按快门。</p>
  <div class="viewfinder" id="viewfinder" data-background="dusk"><div class="frame-corners" aria-hidden="true"></div><canvas id="potCanvas" aria-label="陶器取景画面。拖动以调整拍摄角度"></canvas><span class="view-label">LIVE VIEW <b>●</b></span><span id="materialName" class="material-label">暖陶土</span></div>
  <div class="shutter-row"><span id="sourceNote">读取作品中…</span><button id="shutter" type="button" aria-label="拍摄当前陶器"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 10h5l2.2-3h7.6l2.2 3H27v16H5z"/><circle cx="16" cy="18" r="5"/></svg><span>拍照</span></button><span>4 : 5<br>作品照</span></div>
</section>
<section class="control-panel" aria-label="取景设置"><div class="control-title"><span>01 / 光与角度</span><small>取景设置</small></div>
  <label class="slider-row" for="lightDirection"><span>灯光方向</span><input id="lightDirection" type="range" min="0" max="360" value="135"><output id="lightDirectionValue">135°</output></label>
  <label class="slider-row" for="lightStrength"><span>灯光强度</span><input id="lightStrength" type="range" min="40" max="160" value="114"><output id="lightStrengthValue">114%</output></label>
  <label class="slider-row" for="zoom"><span>取景远近</span><input id="zoom" type="range" min="320" max="650" value="450"><output id="zoomValue">远景</output></label>
  <label class="title-field" for="workTitle">作品名称<input id="workTitle" maxlength="50" value="窑火之后" autocomplete="off"></label>
  <p class="tip">在画面上横向拖动转动器身，纵向拖动调整俯仰。按下快门后照片即定格并保存。</p>
</section></div>
<section class="album-section" aria-label="本地照片图册"><div class="album-head"><div><span>02 / 留影</span><h2>我的作品照</h2></div><div><a class="orders-link" href="./shop.html">工坊商店 →</a><a id="albumOrderLink" class="orders-link" href="./orders.html">✉ 阿蘅的来信 →</a><small id="albumCount">0 张</small></div></div><div id="album" class="album-grid"></div></section>
<div id="captureSheet" class="capture-sheet" hidden><div class="capture-card"><button id="saveCapture" class="floating-photo" type="button" aria-label="继续送往下一步"><img id="captureImage" alt="刚拍摄的陶器照片"><span id="captureNext">轻触照片，继续</span></button><p id="captureMessage" role="status"></p></div></div>
<dialog id="photoDialog"><img id="viewPhoto" alt="保存的陶器照片"><div><span id="viewTitle"></span><a id="downloadSaved" download="陶器作品照.jpg">下载照片 ↓</a><button id="closeDialog" type="button">关闭</button></div></dialog>
<div id="renderError" class="render-error" role="alert" hidden></div>
</main>
