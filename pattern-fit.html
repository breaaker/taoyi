<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17271e"><title>花纹适配台 · 泥与火</title><link rel="stylesheet" href="./pattern-fit.css"></head><body>
<main class="fit-studio">
  <header class="top glass"><a href="./pattern-studio.html" aria-label="返回花纹工作台">←</a><div><small>CLAY & FLAME / PATTERN FIT</small><h1>花纹适配台</h1></div><span>在陶器上看效果</span></header>
  <section class="stage" aria-label="三维陶器实时预览"><canvas id="pot" aria-label="可拖动旋转的陶器花纹预览"></canvas><div class="stage-tip">拖动陶器旋转 · 上下调整视角</div><div id="renderError" class="render-error" hidden></div></section>
  <section class="controls glass" aria-label="花纹适配参数">
    <div class="selectors"><label>花纹<select id="pattern"></select></label><label>器型<select id="shape"><option value="ahan-vase-01">收颈花瓶</option><option value="tang-soup-bowl-02">宽浅汤碗</option><option value="shen-ferry-cup-03">直壁水杯</option></select></label><label>泥料<select id="material"><option value="warm-earth">暖陶土</option><option value="red-earth">红陶土</option><option value="stoneware">砂泥</option><option value="porcelain">白瓷</option></select></label></div>
    <div class="sliders"><label>一圈重复 <output id="repeatOut"></output><input id="repeat" type="range" min="1" max="16" value="4"></label><label>单个图案宽度 <output id="scaleOut"></output><input id="scale" type="range" min="2" max="100" value="25"></label><label>图案实际高度 <output id="heightOut"></output><input id="height" type="range" min="2" max="40" value="18"></label><label>贴花位置 <output id="positionOut"></output><input id="position" type="range" min="15" max="90" value="55"></label></div>
    <div class="actions"><button id="save" type="button">确认这组参数</button><button id="nextReview" type="button">下一张待复调</button><button id="snapshot" type="button">下载预览图</button><button id="copy" type="button">复制参数</button><button id="exportFits" type="button">导出全部参数</button></div><p id="reviewStatus"></p><p id="message" role="status">先定单个图案的宽度，再选一圈重复次数；位置会自动均匀分布。</p>
  </section>
</main>
<script src="./engine/geometry.js"></script><script src="./engine/renderer.js"></script><script src="./engine/decoration.js?v=20261005eraser1"></script><script src="./engine/custom-patterns.js"></script><script src="./samples/clay-recipes.js"></script><script src="./art/season-one-standards.js"></script><script src="./content/pattern-fit-presets.js"></script><script src="./pattern-fit.js"></script></body></html>
